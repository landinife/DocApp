<head>
<meta charset="utf-8">

<style>:root{color-scheme:light;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: columna única de teléfono (máx. 480px), encabezado fijo con filtro por persona, barra de pestañas abajo, formularios en hojas que suben desde abajo. */
:root{
  --bg:#EEF4F3; --surface:#FFFFFF; --surface-2:#E3ECEA; --ink:#102E2A; --muted:#58706C; --line:#D2DFDC;
  --accent:#0C8A7B; --accent-soft:#D6F0EC; --on-accent:#FFFFFF; --brand:#1FB5A3;
  --ok:#1E8A4C; --ok-soft:#DDF2E4; --warn:#A8650A; --warn-soft:#FBEBCF; --danger:#BC3B33; --danger-soft:#FADFDC;
  --p-blue:#3466C9; --p-pink:#C9487A; --p-amber:#B97A12; --p-violet:#7A55C7; --p-green:#3B8F4F;
  --per:#BE3A66; --per-1:#FBDCE6; --per-2:#E98DAB; --on-per-2:#4A0F25; --on-per:#FFFFFF;
  --font-display:"Bricolage Grotesque","Figtree",system-ui,sans-serif;
  --font-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:14px; --shadow:0 1px 2px rgba(16,46,42,.06),0 6px 18px rgba(16,46,42,.06);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0C1716; --surface:#152321; --surface-2:#1D2F2C; --ink:#E6F2EF; --muted:#93ABA6; --line:#29403C;
  --accent:#3CCBB8; --accent-soft:#12403A; --on-accent:#06211D; --brand:#1FB5A3;
  --ok:#5BD08A; --ok-soft:#143524; --warn:#F0B354; --warn-soft:#3D2C0C; --danger:#F2857D; --danger-soft:#41201D;
  --p-blue:#7FA5F2; --p-pink:#EE86AD; --p-amber:#E5B052; --p-violet:#B097EE; --p-green:#78C98A;
  --per:#F08BAA; --per-1:#4A1F2E; --per-2:#A8456A; --on-per-2:#FFFFFF; --on-per:#2A0A16;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0C1716; --surface:#152321; --surface-2:#1D2F2C; --ink:#E6F2EF; --muted:#93ABA6; --line:#29403C;
  --accent:#3CCBB8; --accent-soft:#12403A; --on-accent:#06211D; --brand:#1FB5A3;
  --ok:#5BD08A; --ok-soft:#143524; --warn:#F0B354; --warn-soft:#3D2C0C; --danger:#F2857D; --danger-soft:#41201D;
  --p-blue:#7FA5F2; --p-pink:#EE86AD; --p-amber:#E5B052; --p-violet:#B097EE; --p-green:#78C98A;
  --per:#F08BAA; --per-1:#4A1F2E; --per-2:#A8456A; --on-per-2:#FFFFFF; --on-per:#2A0A16;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:480px;margin:0 auto;padding-inline:16px;padding-block:0 104px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 10px;margin-inline:-16px;padding-inline:16px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px}
.brand svg{width:34px;height:34px;flex:none}
.brand h1{font-family:var(--font-display);font-size:22px;font-weight:700;margin:0;letter-spacing:-.01em}
.brand .me{margin-left:auto;font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.chips{display:flex;gap:8px;margin-top:10px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chip{flex:none;display:flex;align-items:center;gap:6px;padding:6px 12px 6px 6px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-weight:600;font-size:13.5px}
.chip.all{padding-left:12px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.av{width:22px;height:22px;border-radius:50%;display:inline-grid;place-items:center;font-size:11px;font-weight:700;color:var(--surface);background:var(--c,var(--muted));flex:none}
.av.lg{width:40px;height:40px;font-size:16px}
main{display:flex;flex-direction:column;gap:18px;padding-top:16px}
h2{font-family:var(--font-display);font-size:19px;font-weight:700;margin:0;text-wrap:balance}
.sec{display:flex;flex-direction:column;gap:8px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.label{font-size:11.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.count{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.sum{background:var(--surface);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px}
.sum .big{font-family:var(--font-display);font-size:26px;font-weight:700;line-height:1.1}
.sum .sub{color:var(--muted);font-size:13.5px}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand);border-radius:99px}
.list{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;width:100%;text-align:left;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .time{flex:none;width:46px;font-variant-numeric:tabular-nums;font-weight:700;font-size:15px}
.row .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.row .t1{font-weight:600;overflow-wrap:anywhere}
.row .t2{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.who{display:inline-flex;align-items:center;gap:4px;font-weight:600;color:var(--c)}
.who::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}
.tick{flex:none;width:36px;height:36px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:transparent}
.tick svg{width:18px;height:18px}
.row.late .time{color:var(--danger)} .row.late .tick{border-color:var(--danger)}
.row.done .tick{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.row.done .t1{color:var(--muted)}
.row.skip .tick{background:var(--surface-2);border-color:var(--surface-2);color:var(--muted)}
.pill{display:inline-flex;align-items:center;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap;background:var(--surface-2);color:var(--muted)}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.soon{background:var(--warn-soft);color:var(--warn)}
.pill.late{background:var(--danger-soft);color:var(--danger)} .pill.load{background:var(--accent-soft);color:var(--accent)}
.mi{flex:none;width:34px;height:34px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.mi svg{width:19px;height:19px}
.row.done .mi,.row.skip .mi{background:var(--surface-2);color:var(--muted)}
.chipw{display:flex;flex-wrap:wrap;gap:8px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .dow{font-size:11px;font-weight:700;color:var(--muted);text-align:center;padding:2px 0}
.cd{aspect-ratio:1;border-radius:10px;display:grid;place-items:center;font-variant-numeric:tabular-nums;font-weight:600;font-size:14px;position:relative;background:var(--surface-2);min-width:0}
.cd.out{visibility:hidden}
.cd.fe{background:var(--accent-soft);color:var(--accent)}
.cd.ov{box-shadow:inset 0 0 0 2px var(--accent)}
.cd.pp{background:transparent;border:1.5px dashed var(--per);color:var(--per)}
.cd.f1{background:var(--per-1);color:var(--per)} .cd.f2{background:var(--per-2);color:var(--on-per-2)} .cd.f3{background:var(--per);color:var(--on-per)}
.cd.today{outline:2px solid var(--ink);outline-offset:1px}
.cd i{position:absolute;bottom:4px;width:5px;height:5px;border-radius:50%;background:currentColor}
.calh{display:flex;align-items:center;justify-content:space-between;gap:8px}
.calh b{font-family:var(--font-display);font-size:17px}
.leg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted)}
.leg span{display:inline-flex;align-items:center;gap:6px}
.leg .cd{width:16px;aspect-ratio:1;border-radius:5px}
.chk{display:flex;align-items:center;gap:10px;font-weight:600}
.chk input{width:20px;height:20px;accent-color:var(--accent)}
.tag{font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);border:1px dashed var(--line);border-radius:5px;padding:0 5px}
.note{display:flex;gap:10px;align-items:flex-start;background:var(--warn-soft);color:var(--warn);border-radius:var(--r);padding:10px 14px;font-size:13.5px;font-weight:500}
.note.info{background:var(--accent-soft);color:var(--accent)}
.note button{margin-left:auto;flex:none;font-weight:700;text-decoration:underline}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mini{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:12px 14px;display:flex;flex-direction:column;gap:3px;text-align:left;min-width:0}
.mini b{font-size:14.5px;overflow-wrap:anywhere}
.mini span{font-size:13px;color:var(--muted)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface-2);border-radius:11px;padding:3px}
.seg button{padding:8px;border-radius:9px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 16px;border-radius:12px;font-weight:700;background:var(--accent);color:var(--on-accent);width:100%}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.btn.danger{background:var(--danger-soft);color:var(--danger)}
.btn.sm{width:auto;padding:7px 12px;font-size:13.5px;border-radius:10px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.empty{padding:22px 16px;text-align:center;color:var(--muted);font-size:14px}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav div{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
.nav button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 1px 9px;font-size:10.5px;font-weight:600;color:var(--muted);min-width:0}
.nav svg{width:22px;height:22px}
.nav button[aria-current="page"]{color:var(--accent)}
.fab{position:fixed;z-index:6;right:max(16px,calc(50% - 224px));bottom:calc(72px + env(safe-area-inset-bottom,0px));width:54px;height:54px;border-radius:18px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;box-shadow:0 6px 16px color-mix(in srgb,var(--accent) 35%,transparent)}
.fab svg{width:26px;height:26px}
.scrim{position:fixed;inset:0;z-index:10;background:rgba(6,20,18,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:480px;max-height:92%;overflow-y:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.sheet-h{display:flex;align-items:flex-start;gap:10px}
.sheet-h h2{flex:1}
.x{width:32px;height:32px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;flex:none}
.x svg{width:16px;height:16px}
.gear{width:34px;height:34px;border-radius:50%;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;flex:none;color:var(--muted)}
.gear svg{width:19px;height:19px}
.gear[aria-current="page"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pre{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px;white-space:pre-wrap;font-size:14px;overflow-wrap:anywhere}
.f{display:flex;flex-direction:column;gap:5px;min-width:0}
.f>span{font-size:12.5px;font-weight:700;color:var(--muted)}
.f input,.f select,.f textarea{width:100%;min-width:0;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg)}
.f textarea{min-height:64px;resize:vertical}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:11px 12px;border:1.5px solid var(--line);border-radius:12px;text-align:left;width:100%}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt b{display:block} .opt small{color:var(--muted);font-size:13px}
.opt .dot{flex:none;width:18px;height:18px;border-radius:50%;border:2px solid var(--line);margin-top:2px}
.opt[aria-pressed="true"] .dot{border-color:var(--accent);background:radial-gradient(var(--accent) 45%,transparent 50%)}
.stack{display:flex;flex-direction:column;gap:8px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0;text-align:right;font-weight:600;overflow-wrap:anywhere}
.photo{max-height:160px;border-radius:10px;border:1px solid var(--line)}
.toast{position:fixed;z-index:20;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;font-weight:600;font-size:13.5px;max-width:90%}
.err{color:var(--danger);font-size:13px;font-weight:600}
.foot{font-size:12.5px;color:var(--muted);text-align:center}
.foot a{color:var(--accent)}
.gate{position:fixed;inset:0;z-index:30;background:var(--bg);display:grid;place-items:center;padding:24px}
.gate-card{max-width:340px;width:100%;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.gate-card svg{width:84px;height:84px}
.gate-card h2{font-size:28px}
.gate-card p{margin:0;color:var(--muted);overflow-wrap:anywhere}
.brand h1 span{color:var(--accent)}
:root[data-accent="blue"]{--accent:light-dark(#2F62C9,#86ABF5);--accent-soft:light-dark(#DDE7FA,#1A2C52);--brand:#4C7FE6;--on-accent:light-dark(#FFFFFF,#0B1424)}
:root[data-accent="violet"]{--accent:light-dark(#7046C4,#B49BF0);--accent-soft:light-dark(#E9E1F8,#2E2350);--brand:#8B63DB;--on-accent:light-dark(#FFFFFF,#150E28)}
:root[data-accent="coral"]{--accent:light-dark(#C2473A,#F28C80);--accent-soft:light-dark(#FADFDB,#4A211C);--brand:#E0624F;--on-accent:light-dark(#FFFFFF,#2A0F0B)}
:root[data-accent="amber"]{--accent:light-dark(#9A6400,#EBB04A);--accent-soft:light-dark(#F8E9C8,#3F2D0A);--brand:#D9972B;--on-accent:light-dark(#FFFFFF,#241800)}
.sws{display:flex;gap:14px;flex-wrap:wrap}
.sw{width:40px;height:40px;border-radius:50%;background:var(--c);border:3px solid var(--bg);box-shadow:0 0 0 2px var(--line)}
.sw[aria-pressed="true"]{box-shadow:0 0 0 3px var(--ink)}
@media (max-width:360px){.pair,.g2{grid-template-columns:1fr}}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
.tchart{flex:none;aspect-ratio:320/150;width:100%;height:auto;display:block;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.res{white-space:pre-wrap;font-family:inherit;font-size:14px;line-height:1.5;background:var(--surface-2);border-radius:12px;padding:12px 14px;margin:0}
.sum.ep{border:1.5px solid var(--warn)}
.pill.cold{background:color-mix(in srgb,var(--p-blue) 16%,transparent);color:var(--p-blue)}
</style>

</div></div>
<div class="app">
  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 140 140" aria-hidden="true"><rect width="140" height="140" rx="32" style="fill:var(--brand)"/><path d="M70 28 114 66H26Z" fill="#fff" stroke="#fff" stroke-width="8" stroke-linejoin="round"/><rect x="38" y="60" width="64" height="52" rx="7" fill="#fff"/><rect x="64" y="68" width="12" height="36" rx="3" style="fill:var(--brand)"/><rect x="52" y="80" width="36" height="12" rx="3" style="fill:var(--brand)"/></svg>

function epAlerts(e){
  const out=[],mx=epMax(e),mn=epMin(e),fev=epTemps(e).filter(x=>x.temp>=38),p=P(e.who);
  if(mx!=null&&mx>=S.alert.temp)out.push('Llegó a '+fT(mx)+'.');
  if(mn!=null&&mn<S.alert.low)out.push('Bajó a '+fT(mn)+'.');
  if(fev.length&&!e.end){const h=(Date.now()-fev[0].t)/H;if(h>S.alert.hours)out.push('Lleva más de '+S.alert.hours+' horas con fiebre.')}
  if(fev.length&&p.birth&&(Date.now()-pd(p.birth))<91*D)out.push('En bebés de menos de 3 meses cualquier fiebre se consulta enseguida.');
  return out;
}
function alertNote(e){const a=epAlerts(e);if(!a.length)return'';const p=P(e.who);
  return `<div class="note"><span><b>Conviene consultar al médico.</b> ${a.join(' ')}</span>${p.tel?`<a class="btn sm" style="text-decoration:none;background:var(--warn);color:#fff" href="tel:${esc(p.tel)}">Llamar</a>`:''}</div>`}
function chart(e){
  const ts=epTemps(e);if(!ts.length)return'';
  const t0=Math.min(e.start,ts[0].t),t1=Math.max(ts[ts.length-1].t,t0+6*H,e.next||0),W=320,Hh=150,L=30,R=8,T=10,B=22;
  const lo=Math.min(35.5,Math.floor((epMin(e)-.3)*2)/2),hi=Math.max(40.5,Math.ceil((epMax(e)+.3)*2)/2),x=t=>L+(t-t0)/(t1-t0)*(W-L-R),y=v=>T+(hi-v)/(hi-lo)*(Hh-T-B);
  const ln=(v,c,dash,lbl)=>`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="${c}" stroke-width="1" ${dash?'stroke-dasharray="4 4"':''}/><text x="${L-4}" y="${y(v)+4}" text-anchor="end" font-size="10" fill="var(--muted)">${lbl}</text>`;
  const pts=ts.map(p=>x(p.t).toFixed(1)+','+y(+p.temp).toFixed(1)).join(' ');
  const col={late:'var(--danger)',soon:'var(--warn)',ok:'var(--ok)',cold:'var(--p-blue)'};
  return `<svg class="tchart" viewBox="0 0 ${W} ${Hh}" role="img" aria-label="Temperatura del episodio, máxima ${fT(epMax(e))}">
    ${ln(36,'var(--p-blue)',1,'36')}${lo<S.alert.low?ln(S.alert.low,'var(--p-blue)',1,String(S.alert.low).replace('.',',')):''}${ln(37,'var(--line)',0,'37')}${ln(38,'var(--warn)',1,'38')}${S.alert.temp>38?ln(S.alert.temp,'var(--danger)',1,String(S.alert.temp).replace('.',',')):''}${ln(40,'var(--line)',0,'40')}
    <polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    ${ts.map(p=>`<circle cx="${x(p.t).toFixed(1)}" cy="${y(+p.temp).toFixed(1)}" r="4" fill="${col[tK(+p.temp)]}" stroke="var(--surface)" stroke-width="1.5"/>`).join('')}
    <text x="${L}" y="${Hh-6}" font-size="10" fill="var(--muted)">${whenTxt(t0)}</text><text x="${W-R}" y="${Hh-6}" font-size="10" fill="var(--muted)" text-anchor="end">${whenTxt(t1)}</text></svg>`;
}
function epCard(e){
  const l=epLast(e),dia=Math.floor((sod(Date.now())-sod(e.start))/D)+1;
  return `<div class="sum ep"><div><div class="label">Síntomas en curso · ${esc(P(e.who).name)}</div><div class="big">${esc(e.title)} · día ${dia}</div>
    <div class="sub">${l?`Última medición ${whenTxt(l.t)}${l.temp!=null&&l.temp!==''?': <span class="pill ${tK(+l.temp)}">'+fT(l.temp)+'</span>':''}.`:'Sin mediciones todavía.'}${e.next?` Volver a medir ${e.next<Date.now()?'<b>ya</b> (tocaba '+whenTxt(e.next)+')':'a las '+whenTxt(e.next)}.`:''}</div></div>
    ${alertNote(e)}
    <div class="g2"><button class="btn" data-act="mdNew" data-id="${e.id}">Agregar medición</button><button class="btn ghost" data-act="epView" data-id="${e.id}">Ver episodio</button></div></div>`;
}

const _vHis=vHis;
vHis=function(){
  const seg=S.hisSeg||'estudios';
  let h=`<div class="seg" role="group"><button data-seg="hisSeg:estudios" aria-pressed="${seg==='estudios'}">Estudios y consultas</button><button data-seg="hisSeg:episodios" aria-pressed="${seg==='episodios'}">Episodios</button></div>`;
  if(seg==='estudios')return h+_vHis();
  const o=epOpen(),done=S.epi.filter(x=>x.end&&show(x)).sort((a,b)=>b.start-a.start);
  h+=`<section class="sec"><div class="sec-h"><span class="label">En curso</span><button class="btn sm ghost" data-act="epNew">Nuevo episodio</button></div><div class="list">${o.map(ep=>{const l=epLast(ep),nt=epMeds(ep).length;return `<button class="row" data-act="epView" data-id="${ep.id}"><span class="body"><span class="t1">${esc(ep.title)} ${ep.demo?'<span class="tag">ejemplo</span>':''}</span><span class="t2">${who(ep.who)}<span>Desde ${whenTxt(ep.start)}</span>${l&&l.temp!=null&&l.temp!==''?`<span class="pill ${tK(+l.temp)}">${fT(l.temp)}</span>`:''}${nt?`<span class="pill load">${nt===1?'1 tratamiento':nt+' tratamientos'}</span>`:''}</span></span></button>`}).join('')||'<div class="empty">Nada en curso. Si alguien se siente mal, tocá Nuevo episodio y andá anotando cómo sigue.</div>'}</div></section>`;
  const by={};done.forEach(ep=>(by[iso(ep.start).slice(0,4)]??=[]).push(ep));
  h+=Object.keys(by).sort().reverse().map(y=>`<section class="sec"><div class="sec-h"><span class="label">${y}</span><span class="count">${by[y].length}</span></div><div class="list">${by[y].map(ep=>hisRow({_ep:ep,date:iso(ep.start)})).join('')}</div></section>`).join('');
  if(!done.length)h+=`<p class="foot" style="margin:0">Los episodios cerrados quedan acá, con su gráfico y su resumen.</p>`;
  return h;
};

function shMd(e,x){

const phList=()=>SH.photos.length?`<div class="chipw">${SH.photos.map((f,i)=>`<span class="pill">${esc(f.name)}</span>`).join('')}</div>`:'';

function resumenEp(e){
  const p=P(e.who),L=[e.title+' de '+p.name+(ageTxt(p)?' ('+ageTxt(p)+')':''),'Desde '+fdt(e.start)+(e.end?' hasta '+fdt(e.end):' · sigue en curso')+' · '+dur((e.end||Date.now())-e.start)];
  const mx=epMax(e),mn=epMin(e);if(mx!=null)L.push('Temperatura máxima: '+fT(mx)+(mn<36?' · mínima: '+fT(mn):''));
  const meds={};e.entries.forEach(x=>{if(x.med){const k=x.med.name;meds[k]=(meds[k]||0)+1}});
  if(Object.keys(meds).length)L.push('Medicación dada: '+Object.entries(meds).map(([k,n])=>k+' ('+n+(n===1?' vez':' veces')+')').join(', '));
  L.push('','Mediciones:');
  e.entries.slice().sort((a,b)=>a.t-b.t).forEach(x=>L.push('- '+fd(iso(x.t)).slice(0,5)+' '+hm(x.t)+[x.temp!=null&&x.temp!==''?fT(x.temp):'',[...x.sym,x.other].filter(Boolean).join(', ').toLowerCase(),x.med?'se dio '+x.med.name+' '+x.med.dose:'',x.notes].filter(Boolean).map(s=>' · '+s).join('')));
  return L.join('\n');
}

  epView(d){const e=S.epi.find(x=>x.id===d.id);if(e)shEp(e)},

    if(temp!=null&&(isNaN(temp)||temp<30||temp>43))return fail('md-err','Revisá la temperatura: tiene que estar entre 30 y 43 °C.');

    const med=m?{id:m.id,name:m.name,dose:doseTxt||m.qty+' '+m.unit}:cm?{id:'',name:cm.name,dose:doseTxt||cm.qty+' '+cm.unit}:mid==='otro'?{id:'',name:on,dose:doseTxt}:null;
    if(mid==='otro'&&temp==null&&false){}
    if(mid==='otro'){const u=(doseTxt.match(/ml|mg|gotas|comprimido|cápsula|sobre|puff/i)||[''])[0].toLowerCase();if(catAdd(on,parseFloat(doseTxt.replace(',','.'))||1,u))setTimeout(()=>toast('"'+on+'" se agregó a medicamentos frecuentes'),50)}
    if(temp==null&&!SH.sym.length&&!val('md-other')&&!med&&!val('md-notes')&&!SH.photos.length)return fail('md-err','Cargá la temperatura, un síntoma o una nota.');
    const o={t,temp,sym:SH.sym,other:val('md-other'),med,notes:val('md-notes'),photos:SH.photos,by:S.me};
    if(x)Object.assign(x,o);else{e.entries.push(Object.assign({id:uid()},o));if(m){m.logs.push({s:t,t,by:S.me});if(m.stock!=null)m.stock=Math.max(0,m.stock-1)}e.next=SH.next?t+SH.next*H:null}
    closeSheet();render();shEp(e);toast(x?'Medición actualizada':SH&&e.next?'Medición guardada. Aviso para volver a medir a las '+hm(e.next):'Medición guardada')},
  mdDel(_,b){if(!SH.del){SH.del=true;b.textContent='Tocá de nuevo para confirmar';return}const {e,x}=SH;e.entries=e.entries.filter(y=>y!==x);closeSheet();render();shEp(e)},
  epClose(){const e=SH.e;e.end=Math.max(Date.now(),...e.entries.map(x=>x.t));e.next=null;closeSheet();render();toast('Episodio cerrado: queda en la historia clínica')},
  epReopen(){const e=SH.e;e.end=null;closeSheet();render();shEp(e)},
  epDel(_,b){if(!SH.del){SH.del=true;b.textContent='Tocá de nuevo para confirmar';return}S.epi=S.epi.filter(y=>y!==SH.e);closeSheet();render();toast('Episodio eliminado')},
  epRes(){const e=SH.e,t=resumenEp(e);SH={k:'res',e,text:t};sheet('Resumen para el pediatra',`<pre class="res">${esc(t)}</pre><button class="btn" data-act="epShare">Compartir (Share)</button><button class="btn ghost" data-act="epCopy">Copiar</button><button class="btn ghost" data-act="epView" data-id="${e.id}">Volver al episodio</button>`)},
  epShare(){const t=SH.text;(navigator.share?navigator.share({text:t}):Promise.reject()).catch(()=>ACT.epCopy())},
  epCopy(){(navigator.clipboard?navigator.clipboard.writeText(SH.text):Promise.reject()).then(()=>toast('Resumen copiado')).catch(()=>toast('No se pudo copiar'))}
});

    const api=async u=>{const r=await fetch('https://www.googleapis.com/calendar/v3/'+u,{headers:{Authorization:'Bearer '+tok}}),j=await r.json();if(!r.ok)throw{message:(j.error&&j.error.message)||('error '+r.status)};return j};
    const cl=await api('users/me/calendarList?maxResults=250');
    const cal=(cl.items||[]).find(c=>(c.summaryOverride||c.summary||'').trim().toLowerCase()==='salud');
    if(!cal){say('No encontré un calendario llamado "Salud" en la cuenta '+USER.email+'. Calendarios que veo: '+((cl.items||[]).map(c=>c.summaryOverride||c.summary).join(', ')||'ninguno')+'.',1);return}
    const ev=await api('calendars/'+encodeURIComponent(cal.id)+'/events?singleEvents=true&orderBy=startTime&maxResults=250&timeMin='+encodeURIComponent(new Date(Date.now()-60*D).toISOString()));
    const rx=t=>t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');let add=0,upd=0,del=0;const seen={};
    (ev.items||[]).forEach(e=>{
      if(e.status==='cancelled')return;
      const st=e.start||{},dt=st.dateTime?new Date(st.dateTime):null,date=dt?iso(dt):st.date;if(!date)return;
      let title=(e.summary||'Turno').trim(),wid=null;
      const mt=title.match(/^([^:\-–]{2,20})\s*[:\-–]\s*(.+)$/);
      if(mt){const p=S.people.find(p=>p.name.toLowerCase()===mt[1].trim().toLowerCase());if(p){wid=p.id;title=mt[2].trim()}}
      if(!wid){const p=S.people.find(p=>new RegExp('(^|[^\\p{L}])'+rx(p.name)+'($|[^\\p{L}])','iu').test(title));if(p)wid=p.id}
      seen[e.id]=1;
      const o={what:cap(title),date,time:dt?hm(dt):'',place:e.location||'',notes:(e.description||'').replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim().slice(0,500)};
      const t=S.turnos.find(x=>x.gid===e.id);
      if(t){const k=x=>JSON.stringify([x.what,x.date,x.time,x.place,x.notes]),b=k(t);Object.assign(t,o);if(b!==k(t))upd++}
      else{S.turnos.push(Object.assign({id:uid(),gid:e.id,who:wid||(S.people.some(p=>p.id===S.me)?S.me:S.people[0].id),prof:''},o));add++}
    });
    const td=iso(Date.now());
    S.turnos=S.turnos.filter(t=>{if(t.gid&&!seen[t.gid]&&t.date>=td&&!t.hist){del++;return false}return true});
    say('Leí '+(ev.items||[]).length+' eventos del calendario Salud: '+add+' nuevos, '+upd+' actualizados, '+del+' quitados. '+new Date().toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'})+' h.');
  }catch(e){if(e&&(e.code==='auth/popup-closed-by-user'||e.code==='auth/cancelled-popup-request')){say('Se cerró la ventana de Google antes de terminar. Tocá el botón de nuevo.',1);return}
    const raw=String((e&&(e.code||e.message))||'error'),hint=/has not been used|is disabled|accessNotConfigured/i.test(raw)?'Falta habilitar la API de Google Calendar en el proyecto fliaapp de Google Cloud. ':/insufficient|scope|PERMISSION_DENIED/i.test(raw)?'Google no dio el permiso para ver el calendario. Tocá el botón de nuevo y, en la pantalla de Google, tildá la casilla para ver tus calendarios. ':/user-mismatch/.test(raw)?'Elegiste otra cuenta de Google. Usá la misma con la que entraste a la app. ':/popup-blocked/.test(raw)?'El navegador bloqueó la ventana de Google. Permití las ventanas emergentes para este sitio. ':'';
    say(hint+'Detalle: '+raw,1)}
};

  auth=firebase.auth();db=firebase.firestore();
